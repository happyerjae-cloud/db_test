<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <script>
    const SUPABASE_URL = "https://vyrlsntgnwdpbaaahgvg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fZ39zSVsiQa_vdo_kqkrFA_A8BSUA8u";
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>body { visibility: hidden; }</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo"><span class="logo-mark">P</span>내 포트폴리오</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1 id="title">로그인</h1>

      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="name">이름</label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" required autocomplete="email" placeholder="example@email.com">
        </div>
        <div class="field" id="passwordField">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="비밀번호를 입력해주세요">
        </div>
        <div class="field" id="birthField" hidden>
          <label for="birthdate">생년월일</label>
          <input type="date" id="birthdate">
        </div>
        <div class="field" id="colorField" hidden>
          <label for="favoriteColor">좋아하는 색</label>
          <input type="color" id="favoriteColor" value="#31572c">
        </div>
        <div class="field" id="bioField" hidden>
          <label for="bio">한줄 소개 (선택)</label>
          <input type="text" id="bio" maxlength="40" placeholder="나를 한 줄로 소개해주세요">
        </div>
        <button type="submit" id="submitBtn">로그인</button>
      </form>

      <p id="result"></p>

      <p class="toggle">
        <span id="toggleText">계정이 없나요?</span>
        <a href="#" id="toggleLink">회원가입</a>
      </p>
      <p class="toggle" id="forgotWrap">
        <a href="#" id="forgotLink">비밀번호를 잊으셨나요?</a>
      </p>
    </div>
  </main>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    // 로그인/로그아웃/세션 확인 때마다 사이트 컬러를 갱신
    supabaseClient.auth.onAuthStateChange((_event, session) => syncTheme(session));
    const result = document.getElementById("result");
    const title = document.getElementById("title");
    const submitBtn = document.getElementById("submitBtn");
    const toggleText = document.getElementById("toggleText");
    const toggleLink = document.getElementById("toggleLink");
    const passwordInput = document.getElementById("password");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const birthField = document.getElementById("birthField");
    const birthInput = document.getElementById("birthdate");
    const bioField = document.getElementById("bioField");
    const bioInput = document.getElementById("bio");
    const colorField = document.getElementById("colorField");
    const colorInput = document.getElementById("favoriteColor");

    const passwordField = document.getElementById("passwordField");
    const forgotWrap = document.getElementById("forgotWrap");
    const forgotLink = document.getElementById("forgotLink");

    let mode = "login"; // "login" | "signup" | "reset"

    // 이미 로그인되어 있으면 화면을 보여주지 않고 바로 이동
    (async () => {
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
          location.replace("index.html");
          return;
        }
      } catch (err) {
        // 세션 확인에 실패하면 로그인 화면을 그대로 보여줌
      }
      document.body.style.visibility = "visible";
    })();

    function render() {
      const isLogin = mode === "login";
      const isSignup = mode === "signup";
      const isReset = mode === "reset";

      const heading = isLogin ? "로그인" : isSignup ? "회원가입" : "비밀번호 재설정";
      document.title = heading;
      title.textContent = heading;
      submitBtn.textContent = isLogin ? "로그인" : isSignup ? "회원가입" : "재설정 링크 보내기";

      if (isLogin) {
        toggleText.textContent = "계정이 없나요?";
        toggleLink.textContent = "회원가입";
      } else if (isSignup) {
        toggleText.textContent = "이미 계정이 있나요?";
        toggleLink.textContent = "로그인";
      } else {
        toggleText.textContent = "";
        toggleLink.textContent = "로그인으로 돌아가기";
      }

      passwordInput.autocomplete = isSignup ? "new-password" : "current-password";
      passwordField.hidden = isReset;
      passwordInput.required = !isReset; // 숨겨진 칸의 required가 제출을 막지 않도록
      forgotWrap.hidden = !isLogin;
      nameField.hidden = !isSignup;
      colorField.hidden = !isSignup;
      bioField.hidden = !isSignup;
      birthField.hidden = !isSignup;
      result.textContent = "";
    }

    function errorMessage(error) {
      if (error.code === "user_already_exists" || /already registered/i.test(error.message)) {
        return "이미 가입된 이메일이에요";
      }
      if (error.code === "invalid_credentials" || /invalid login credentials/i.test(error.message)) {
        return "이메일이나 비밀번호가 맞지 않아요";
      }
      return `실패했어요: ${error.message}`;
    }

    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "login" ? "signup" : "login";
      render();
    });

    forgotLink.addEventListener("click", (e) => {
      e.preventDefault();
      mode = "reset";
      render();
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = passwordInput.value;

      if (mode === "reset") {
        result.textContent = "보내는 중...";
        const redirectTo = new URL("new-password.html", location.href).href;
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
        result.textContent = error ? errorMessage(error) : "이메일을 확인해주세요";
      } else if (mode === "login") {
        result.textContent = "로그인 중...";
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          result.textContent = errorMessage(error);
        } else {
          location.href = "index.html";
        }
      } else {
        const name = nameInput.value.trim();
        if (!name) {
          result.textContent = "이름을 입력해주세요";
          return;
        }
        if (!birthInput.value) {
          result.textContent = "생년월일을 입력해주세요";
          return;
        }
        if (!colorInput.value) {
          result.textContent = "좋아하는 색을 선택해주세요";
          return;
        }
        result.textContent = "가입 중...";
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              name,
              birthdate: birthInput.value,
              bio: bioInput.value.trim(),
              favorite_color: colorInput.value,
            },
          },
        });
        if (error) {
          result.textContent = errorMessage(error);
        } else if (data.user && data.user.identities && data.user.identities.length === 0) {
          // 이메일 확인이 켜져 있으면 중복 가입도 오류 없이 돌아오고, identities가 비어 있음
          result.textContent = "이미 가입된 이메일이에요";
        } else {
          location.href = "index.html";
        }
      }
    });
  </script>
</body>
</html>
