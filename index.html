<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 포트폴리오</title>
  <script>
    const SUPABASE_URL = "https://vyrlsntgnwdpbaaahgvg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fZ39zSVsiQa_vdo_kqkrFA_A8BSUA8u";
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo"><span class="logo-mark">P</span>내 포트폴리오</a>
      <nav>
        <span class="welcome" id="welcome" hidden></span>
        <a href="index.html">홈</a>
        <a href="mypage.html" id="mypageLink" hidden>마이페이지</a>
        <a href="login.html" id="authLink" hidden>로그인</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="birthday" id="birthday" hidden>생일 축하합니다 🎂</p>
    <h1>내 포트폴리오</h1>
  </main>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    // 로그인/로그아웃/세션 확인 때마다 사이트 컬러를 갱신
    supabaseClient.auth.onAuthStateChange((_event, session) => syncTheme(session));
    const authLink = document.getElementById("authLink");

    (async () => {
      let loggedIn = false;
      let userName = "";
      let isBirthday = false;
      try {
        const { data } = await supabaseClient.auth.getSession();
        loggedIn = !!data.session;
        if (loggedIn) {
          const meta = data.session.user.user_metadata || {};
          userName = meta.name || "";
          // 생년월일은 "YYYY-MM-DD" 문자열이라 월-일 부분만 오늘(내 시간대)과 비교
          const now = new Date();
          const today = `${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
          isBirthday = typeof meta.birthdate === "string" && meta.birthdate.slice(5) === today;
        }
      } catch (err) {
        // 세션 확인 실패 시 로그아웃 상태로 취급
      }

      if (loggedIn) {
        const welcome = document.getElementById("welcome");
        welcome.textContent = `${userName || "회원"}님 환영합니다`;
        welcome.hidden = false;
        document.getElementById("birthday").hidden = !isBirthday;
        document.getElementById("mypageLink").hidden = false;
        authLink.textContent = "로그아웃";
        authLink.href = "#";
        authLink.addEventListener("click", async (e) => {
          e.preventDefault();
          await supabaseClient.auth.signOut();
          location.href = "login.html";
        });
      }
      authLink.hidden = false;
    })();
  </script>
</body>
</html>
