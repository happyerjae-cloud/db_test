<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 비밀번호 설정</title>
  <script>
    const SUPABASE_URL = "https://vyrlsntgnwdpbaaahgvg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fZ39zSVsiQa_vdo_kqkrFA_A8BSUA8u";
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo"><span class="logo-mark">P</span>내 포트폴리오</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>새 비밀번호 설정</h1>

      <form id="newPasswordForm">
        <div class="field">
          <label for="newPassword">새 비밀번호</label>
          <input type="password" id="newPassword" required autocomplete="new-password" placeholder="새 비밀번호를 입력해주세요">
        </div>
        <button type="submit" id="submitBtn">비밀번호 변경</button>
      </form>

      <p id="result"></p>
    </div>
  </main>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    // 로그인/로그아웃/세션 확인 때마다 사이트 컬러를 갱신
    supabaseClient.auth.onAuthStateChange((_event, session) => syncTheme(session));
    const form = document.getElementById("newPasswordForm");
    const submitBtn = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    // 재설정 메일의 링크로 들어오면 주소의 토큰으로 임시 로그인 세션이 만들어짐
    (async () => {
      let hasSession = false;
      try {
        const { data } = await supabaseClient.auth.getSession();
        hasSession = !!data.session;
      } catch (err) {
        hasSession = false;
      }
      if (!hasSession) {
        form.hidden = true;
        result.textContent = "유효하지 않거나 만료된 링크예요. 비밀번호 재설정 메일을 다시 받아주세요.";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      result.textContent = "변경 중...";

      const { error } = await supabaseClient.auth.updateUser({
        password: document.getElementById("newPassword").value,
      });

      if (error) {
        result.textContent = `실패했어요: ${error.message}`;
        submitBtn.disabled = false;
        return;
      }

      result.textContent = "비밀번호가 바뀌었습니다";
      // 재설정 세션이 남아 있으면 login.html이 바로 index.html로 보내 버리므로 로그아웃 후 이동
      await supabaseClient.auth.signOut();
      setTimeout(() => { location.href = "login.html"; }, 1500);
    });
  </script>
</body>
</html>
